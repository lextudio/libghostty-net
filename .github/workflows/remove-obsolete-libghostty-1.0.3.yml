name: Remove obsolete LibGhostty.Net 1.0.3 package

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete LibGhostty.Net 1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_ids="$(gh api --paginate \
            '/orgs/lextudio/packages/nuget/LibGhostty.Net/versions?per_page=100' \
            --jq '.[] | select(.name == "1.0.3") | .id')"
          if [[ -z "${version_ids}" ]]; then
            echo 'LibGhostty.Net 1.0.3 is already absent.'
            exit 0
          fi
          while IFS= read -r version_id; do
            gh api --method DELETE \
              "/orgs/lextudio/packages/nuget/LibGhostty.Net/versions/${version_id}"
          done <<< "${version_ids}"
